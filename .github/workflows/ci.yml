name: ci

on:
  push:
    branches: [main, "integration/**", "lane/**"]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Bootstrap-phase CI flags. Editor builds are skipped because the editor
# pulls Node/pnpm and adds CI minutes without proving anything for the
# engine libs at M0 — re-enabled when lane 22 lands a real React build
# pipeline. Tests are now ON for macOS (Metal) and Linux Vulkan; the
# Linux Dedicated and Windows jobs leave tests OFF (no GPU/display on
# the dedicated runner; Windows CTest infra not fully wired yet).
env:
  # Shared across all jobs — tools and editor off everywhere.
  PSY_CMAKE_FLAGS_BASE: >-
    -DPSYNDER_GX_BUILD_TOOLS=OFF
    -DPSYNDER_GX_EDITOR=OFF

jobs:
  mac:
    name: macOS · Metal · arm64
    runs-on: macos-14
    timeout-minutes: 40
    env:
      PSY_CMAKE_FLAGS: >-
        -DPSYNDER_GX_BUILD_TOOLS=OFF
        -DPSYNDER_GX_EDITOR=OFF
        -DPSYNDER_GX_BUILD_SAMPLES=ON
        -DPSYNDER_GX_BUILD_TESTS=ON
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install Ninja
        run: brew install ninja
      - name: Configure
        run: cmake --preset mac-release $PSY_CMAKE_FLAGS
      - name: Build
        run: cmake --build --preset mac-release
      - name: Unit tests
        run: ctest --preset mac-release --output-on-failure
      - name: Smoke (animated clear color)
        run: |
          LOCK=/tmp/psynder_gx_smoke.lockdir
          while ! mkdir "$LOCK" 2>/dev/null; do sleep 0.5; done
          trap 'rmdir "$LOCK"' EXIT
          if [ -x build/mac-release/bin/sample_00_clear ]; then
            build/mac-release/bin/sample_00_clear --smoke-frames=10
          else
            echo "::warning::sample_00_clear binary missing — build skipped target"
            exit 1
          fi

  linux:
    name: Linux · Vulkan · x86_64
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      PSY_CMAKE_FLAGS: >-
        -DPSYNDER_GX_BUILD_TOOLS=OFF
        -DPSYNDER_GX_EDITOR=OFF
        -DPSYNDER_GX_BUILD_SAMPLES=ON
        -DPSYNDER_GX_BUILD_TESTS=ON
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install toolchain + Vulkan SDK
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-17 ninja-build pkg-config \
            libwayland-dev libwayland-bin wayland-protocols \
            libx11-dev libxkbcommon-dev \
            libxcb1-dev libxcb-randr0-dev libxrandr-dev libxinerama-dev \
            libxcursor-dev libxi-dev libgl1-mesa-dev libpipewire-0.3-dev \
            libpulse-dev libasound2-dev libudev-dev libevdev-dev \
            libxcb-icccm4-dev libxcb-keysyms1-dev libxcb-xfixes0-dev
          # Vulkan SDK from LunarG
          wget -qO - https://packages.lunarg.com/lunarg-signing-key-pub.asc | sudo apt-key add -
          sudo wget -qO /etc/apt/sources.list.d/lunarg-vulkan-noble.list https://packages.lunarg.com/vulkan/lunarg-vulkan-noble.list
          sudo apt-get update
          sudo apt-get install -y vulkan-sdk
      - name: Configure
        run: cmake --preset linux-release $PSY_CMAKE_FLAGS
      - name: Build
        run: cmake --build --preset linux-release
      - name: Unit tests (headless)
        # gpu_smoke skips gracefully when no display/Vulkan loader available.
        run: ctest --preset linux-release --output-on-failure

  linux-dedicated:
    name: Linux · Dedicated Server · headless
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-17 ninja-build pkg-config
      - name: Configure
        # Dedicated-server preset strips graphics + audio + editor; samples
        # are pointless headless, so disable here too. Tests stay OFF
        # because there is no GPU/display on the dedicated runner.
        run: >-
          cmake --preset linux-dedicated-release
          -DPSYNDER_GX_BUILD_TESTS=OFF
          -DPSYNDER_GX_BUILD_TOOLS=OFF
          -DPSYNDER_GX_BUILD_SAMPLES=OFF
      - name: Build
        run: cmake --build --preset linux-dedicated-release

  windows:
    name: Windows · Vulkan · x86_64
    runs-on: windows-2022
    timeout-minutes: 40
    env:
      # Tests OFF for now — Windows runner is slow and CTest infra not
      # fully wired for the platform yet. Re-enable post-M1.
      PSY_CMAKE_FLAGS: >-
        -DPSYNDER_GX_BUILD_TOOLS=OFF
        -DPSYNDER_GX_EDITOR=OFF
        -DPSYNDER_GX_BUILD_SAMPLES=ON
        -DPSYNDER_GX_BUILD_TESTS=OFF
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Install Ninja
        run: choco install ninja -y
      - name: Install Vulkan SDK
        shell: pwsh
        run: |
          # The humbletim action depends on actions/cache@v2 which GitHub
          # auto-fails now. Direct install from LunarG keeps us off third-
          # party action churn. Pin a stable SDK version that matches the
          # one in DESIGN §2.2 + the Linux apt source.
          $version = "1.3.296.0"
          $url = "https://sdk.lunarg.com/sdk/download/$version/windows/VulkanSDK-$version-Installer.exe"
          Invoke-WebRequest -Uri $url -OutFile vulkan-sdk.exe -UseBasicParsing
          # Silent install — the LunarG installer is a Qt IFW package; these
          # are the documented headless flags.
          Start-Process -Wait -FilePath vulkan-sdk.exe -ArgumentList @(
            "--accept-licenses",
            "--default-answer",
            "--confirm-command", "install"
          )
          # Export for subsequent steps.
          "VULKAN_SDK=C:\VulkanSDK\$version"     | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          "C:\VulkanSDK\$version\Bin"             | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
      - name: Configure
        shell: cmd
        run: cmake --preset win-clang-release %PSY_CMAKE_FLAGS%
      - name: Build
        shell: cmd
        run: cmake --build --preset win-clang-release

  format:
    name: clang-format check
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Install clang-format
        run: sudo apt-get install -y clang-format-17
      - name: Check formatting
        run: |
          # Soft check during bootstrap; made strict before v0.2.
          git ls-files '*.h' '*.hpp' '*.cpp' '*.mm' \
            | xargs clang-format-17 --dry-run --Werror || echo "formatting drift — fix before merge"
